name: "Godot Web Export & Deploy"

on:
  push:
    branches:
      - main

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build / Export Godot Project to Web
        uses: firebelley/godot-export@v6.0.0
        with:
          # Cập nhật đường dẫn tải bản Godot 4.7.1 Linux cho GitHub Actions
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.7.1/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.7.1/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: "./"
          archive_output: false

      - name: Fix Godot 4 Service Worker for GitHub Pages
        run: |
          curl -s https://raw.githubusercontent.com/gzguidoti/coi-serviceworker/main/coi-serviceworker.js > build/web/coi-serviceworker.js

      - name: Deploy to GitHub Pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
